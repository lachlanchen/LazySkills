<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root{--ink:#22232a;--muted:#72727d;--line:#e6e6ec;--pink:#ef3672;--mint:#007e70;--blue:#2466e9;--yellow:#f8c83d;--paper:#f7f8fc;letter-spacing:0;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit;border:0;background:none}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}[hidden]{display:none!important}svg{flex:none;vertical-align:middle}h1,h2,p{margin:0}button:disabled{cursor:default}
.topbar{border-bottom:1px solid var(--line);border-top:5px solid var(--pink);background:white;padding:20px 32px;display:flex;align-items:center;gap:18px;justify-content:space-between}.brand{display:flex;align-items:center;gap:13px;min-width:0}.brand-mark{width:44px;height:44px;display:grid;place-items:center;border-radius:8px;background:var(--pink);color:white;flex:none}.brand h1{font-size:23px;font-weight:800}.brand p{font-size:12px;color:var(--muted);margin-top:4px}.totals{display:flex;gap:26px;flex:none}.totals span{font-size:12px;color:var(--muted)}.totals b{display:block;font-size:23px;color:var(--ink);line-height:1.1}.workspace{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1800px;margin:auto}.sidebar{border-right:1px solid var(--line);background:white;padding:22px 12px;min-width:0}.sidebar-title{font-size:12px;font-weight:750;color:var(--muted);padding:0 12px 12px}.pack-list{display:flex;flex-direction:column;gap:5px}.pack-button{display:flex;align-items:center;text-align:left;gap:10px;padding:9px;border-radius:6px;width:100%;min-height:58px;min-width:0;border:1px solid transparent}.pack-button:hover{background:#f1f5ff}.pack-button[aria-current=true]{background:#fff0f5;border-color:#ffc5d8;color:#ac1d4e}.pack-button img{width:42px;height:42px;object-fit:contain;border-radius:4px;background:white;flex:none}.pack-button span{min-width:0;font-size:13px;line-height:1.4;font-weight:650;overflow-wrap:anywhere}.pack-button small{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:3px}.pack-button b{margin-left:auto;font-size:11px;color:var(--muted)}.all-packs{margin-bottom:10px;background:#f4f6fc}.all-packs svg{margin:0 11px;color:var(--blue)}
.content{min-width:0;padding:26px 28px 40px}.collection-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.collection-header h2{font-size:26px;line-height:1.3;overflow-wrap:anywhere}.collection-header p{color:var(--muted);font-size:13px;margin-top:6px}.edition-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}.edition-tabs button{white-space:nowrap;font-size:14px;font-weight:650;padding:10px 16px;border-bottom:3px solid transparent}.edition-tabs button[aria-selected=true]{color:var(--pink);border-color:var(--pink)}.edition-tabs b{font-size:11px;background:#e9ebf2;color:#646575;padding:2px 5px;border-radius:4px;margin-left:5px}.edition-tabs button[aria-selected=true] b{background:#ffe0ec;color:#ad2051}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.search{display:flex;align-items:center;gap:8px;border:1px solid #dadde7;border-radius:6px;background:white;flex:1;min-width:180px;max-width:430px;padding:0 12px;color:var(--muted)}.search input{width:100%;min-width:0;border:0;background:none;padding:10px 0;color:var(--ink)}.toolbar select{border:1px solid #dadde7;background:white;border-radius:6px;padding:10px;max-width:245px;min-width:0;color:var(--ink)}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border:1px solid var(--line);border-radius:6px;background:white;text-decoration:none}.icon-button:hover{border-color:var(--pink);color:var(--pink)}.icon-button[aria-pressed=true]{background:var(--blue);color:white}.result-count{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}figure{margin:0;min-width:0;background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}figure:hover{border-color:#eda5bd;box-shadow:0 6px 20px #35244b0c}.stage{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:white;overflow:hidden;position:relative}.stage:before{content:"";position:absolute;left:12px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--pink)}figure:nth-child(4n+2) .stage:before{background:var(--mint)}figure:nth-child(4n+3) .stage:before{background:var(--yellow)}figure:nth-child(4n) .stage:before{background:var(--blue)}.stage a{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.stage img{width:240px;height:240px;max-width:100%;max-height:100%;object-fit:contain}.small .stage img{width:120px;height:120px}.stage a:focus-visible{outline-offset:-4px}figcaption{border-top:1px solid #f2f2f7;display:grid;grid-template-columns:minmax(0,1fr) 32px;gap:4px;padding:12px 13px 13px}figcaption strong{font-size:16px;overflow-wrap:anywhere}figcaption span{grid-column:1;font-size:11px;color:var(--muted);overflow-wrap:anywhere}figcaption small{grid-column:1 / -1;font-size:11px;color:#8b8c94;line-height:1.5;overflow-wrap:anywhere}figcaption .download{grid-column:2;grid-row:1 / 3;width:30px;height:30px;border:0;color:#90929c}figcaption .download:hover{color:var(--pink);background:#fff0f5}.empty{padding:80px 20px;text-align:center;color:var(--muted)}.empty h3{color:var(--ink);font-size:20px}.empty button{margin-top:16px;color:var(--blue);text-decoration:underline}.footer{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
dialog.sticker-viewer{color:var(--ink)!important;border-color:var(--line)!important;padding:20px!important;box-shadow:0 24px 90px #17223830}.sticker-viewer::backdrop{background:#181823a6!important;backdrop-filter:blur(5px)}.viewer-download{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:var(--pink);color:white!important;border-radius:6px;text-decoration:none}.viewer-tools button:hover{border-color:var(--pink);color:var(--pink)}.viewer-label{font-weight:800}.viewer-note{color:var(--muted)}
@media(min-width:1000px){.sidebar{position:sticky;top:0;height:100dvh;overflow:auto}}@media(max-width:1000px){.workspace{grid-template-columns:205px minmax(0,1fr)}.content{padding:22px 18px}.sticker-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topbar{padding:18px 22px}.toolbar select{max-width:190px}.result-count{margin-left:0}}@media(max-width:700px){.topbar{padding:16px;align-items:flex-start}.brand h1{font-size:19px}.brand p{max-width:225px;font-size:10px}.brand-mark{width:36px;height:36px}.totals{display:none}.workspace{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:10px 14px}.sidebar-title{display:none}.pack-list{flex-direction:row;overflow:auto;padding-bottom:3px;gap:8px}.pack-button{width:auto;min-width:138px;max-width:200px;min-height:50px;flex:none;padding:6px}.pack-button span{font-size:12px}.pack-button small{display:none}.pack-button img{width:32px;height:32px}.all-packs{display:none}.content{padding:20px 14px}.collection-header{margin-bottom:12px}.collection-header h2{font-size:22px}.edition-tabs button{font-size:12px;padding:9px 10px}.toolbar{gap:8px}.search{max-width:none;flex-basis:100%}.toolbar select{flex:1;max-width:none}.sticker-grid{gap:10px}.stage img{width:100%;height:100%}figcaption{padding:9px;gap:3px}figcaption strong{font-size:14px}figcaption small{font-size:10px}.footer{font-size:11px}.viewer-stage img{max-height:45dvh;object-fit:contain}.collection-header p{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">__GRID_ICON__</span><div><h1>伙伴表情馆</h1><p>啦啦侠 · 阿芽酱 · 飒飒君 · 庄子机器人</p></div></div><div class="totals"><span><b>__SERIES_COUNT__</b>个系列</span><span><b>__STICKER_COUNT__</b>张精选</span></div></header>
<div class="workspace"><aside class="sidebar" aria-label="系列导航"><div class="sidebar-title">我们的系列</div><button class="pack-button all-packs" data-choose-pack="">__GRID_ICON__<span>全部系列</span></button><nav class="pack-list">__NAV__</nav></aside>
<section class="content"><header class="collection-header"><div><h2 id="collection-title">全部表情</h2><p id="collection-status">日常的每一种心情，都有伙伴回应。</p></div></header>
<div class="edition-tabs" role="tablist" aria-label="版本"><button role="tab" data-edition="current" aria-selected="true">当前精选<b></b></button><button role="tab" data-edition="archive" aria-selected="false">历史版本<b></b></button><button role="tab" data-edition="alternatives" aria-selected="false">趣味备选<b></b></button><button role="tab" data-edition="all" aria-selected="false">全部<b></b></button></div>
<div class="toolbar"><label class="search">__SEARCH_ICON__<input id="query" type="search" placeholder="寻找一句心情…" aria-label="查找表情"></label><select id="pack" aria-label="系列">__OPTIONS__</select><button id="size" class="icon-button" aria-label="切换聊天预览尺寸" title="切换聊天预览尺寸" aria-pressed="false">__ZOOM_ICON__</button><span class="result-count" id="count" aria-live="polite"></span></div>
<main class="sticker-grid" id="grid">__CARDS__</main><div class="empty" id="empty" hidden><h3>还没有找到这句心情</h3><button id="reset">清除筛选</button></div><footer class="footer"><span>LALACHAN / LazyingArt</span><span>每一版，都是一起长大的记录。</span></footer></section></div>
<script>
const packs=__PACK_DATA__,figures=[...document.querySelectorAll('figure')],p=document.getElementById('pack'),q=document.getElementById('query');let edition='current';
function filter(){let n=0;figures.forEach(f=>{f.hidden=!!((edition!=='all'&&f.dataset.group!==edition)||(p.value&&f.dataset.pack!==p.value)||!f.dataset.search.toLowerCase().includes(q.value.trim().toLowerCase()));if(!f.hidden)n++});document.getElementById('count').textContent=n+' 张';document.getElementById('empty').hidden=n>0;document.querySelectorAll('[data-choose-pack]').forEach(b=>{b.hidden=!!(b.dataset.group&&edition!=='all'&&b.dataset.group!==edition);b.setAttribute('aria-current',String(b.dataset.choosePack===p.value))});[...p.options].forEach(o=>{o.hidden=!!(o.value&&edition!=='all'&&packs.find(x=>x.id===o.value)?.group!==edition)});document.querySelectorAll('[data-edition]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.edition===edition)));const item=packs.find(x=>x.id===p.value);document.getElementById('collection-title').textContent=item?.title||({current:'全部表情',archive:'每一版都值得留下',alternatives:'意外，也有可爱的一面',all:'所有表情与版本'})[edition];document.getElementById('collection-status').textContent=item?.status||'日常的每一种心情，都有伙伴回应。'}
function choose(id){p.value=id;q.value='';const selected=packs.find(x=>x.id===id);if(selected)edition=selected.group;filter();}
window.addEventListener('sticker-reveal',e=>{if(packs.some(x=>x.id===e.detail.pack))choose(e.detail.pack)});
p.onchange=()=>choose(p.value);q.oninput=filter;document.querySelectorAll('[data-choose-pack]').forEach(b=>b.onclick=()=>choose(b.dataset.choosePack));document.querySelectorAll('[data-edition]').forEach(b=>{const group=b.dataset.edition;b.querySelector('b').textContent=figures.filter(f=>group==='all'||f.dataset.group===group).length;b.onclick=()=>{edition=group;p.value='';q.value='';filter()}});document.getElementById('size').onclick=function(){this.setAttribute('aria-pressed',String(document.body.classList.toggle('small')))};document.getElementById('reset').onclick=()=>{p.value='';q.value='';filter()};filter();
const tabs=[...document.querySelectorAll('[data-edition]')];tabs.forEach(b=>b.addEventListener('keydown',e=>{const index=tabs.indexOf(b),target={ArrowRight:(index+1)%tabs.length,ArrowLeft:(index+tabs.length-1)%tabs.length,Home:0,End:tabs.length-1}[e.key];if(target!==undefined){e.preventDefault();tabs[target].click();tabs[target].focus()}}));
</script>__VIEWER__</body></html>
